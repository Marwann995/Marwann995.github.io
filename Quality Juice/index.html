<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quality Juice | Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <span class="badge">Menu Only</span>
      <h1>Quality Juice</h1>
      <p>القائمة فقط — العملاء يشاهدون الأصناف والأسعار ثم يطلبون من الكاشير مباشرة.</p>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="searchInput" type="text" placeholder="ابحث عن منتج..." />
      <div id="categoryButtons" class="category-buttons"></div>
    </section>

    <section class="menu-info">
      <div class="info-card">
        <strong>تنبيه:</strong>
        <span>هذا الموقع للعرض فقط، بدون طلب أونلاين أو دفع إلكتروني.</span>
      </div>
    </section>

    <section id="menuGrid" class="menu-grid"></section>
  </main>

  <footer class="footer">
    <p>Quality Juice © Menu Display</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
