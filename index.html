<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OF - Menu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: rgba(22, 22, 32, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #ff0055;
            --accent-secondary: #7928ca;
            --accent-neon: #00f2fe;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --text-muted: #6c6c8a;
            --addon-bg: rgba(255, 0, 85, 0.05);
            --addon-border: rgba(ff, 0, 85, 0.3);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(18, 18, 26, 0.85);
            --header-gradient: linear-gradient(135deg, #ff0055, #7928ca);
        }

        [data-theme="light"] {
            --bg-color: #f4f5fa;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --accent-primary: #ff0055;
            --accent-secondary: #6200ee;
            --accent-neon: #00b4d8;
            --text-primary: #12121e;
            --text-secondary: #4a4a68;
            --text-muted: #8c8ca8;
            --addon-bg: rgba(255, 0, 85, 0.03);
            --addon-border: rgba(255, 0, 85, 0.4);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Poppins', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* Top Bar & Contact */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: var(--header-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            font-family: 'Poppins', sans-serif;
        }

        .contact-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .contact-pill:hover {
            background: var(--accent-primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: rotate(15deg);
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 280px;
            background: linear-gradient(180deg, rgba(13,13,18,0.2) 0%, var(--bg-color) 100%), 
                        url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-bottom: 25px;
        }

        .hero-title {
            font-size: 42px;
            font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            margin-bottom: 5px;
            background: linear-gradient(90deg, #fff, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 600px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            font-weight: 600;
        }

        /* Horizontal Category Navigation Bar */
        .category-nav-wrapper {
            position: sticky;
            top: 67px;
            z-index: 90;
            background: var(--bg-color);
            padding: 10px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .category-nav-container {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
            position: relative;
        }

        .scroll-btn {
            background: var(--glass-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .scroll-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .category-scroll-bar {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 5px 10px;
            scrollbar-width: none;
        }

        .category-scroll-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 8px 16px;
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .cat-chip i {
            font-size: 16px;
            color: var(--accent-primary);
        }

        .cat-chip:hover, .cat-chip.active {
            background: var(--header-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3);
        }

        .cat-chip:hover i, .cat-chip.active i {
            color: white;
        }

        /* Sidebar Navigation */
        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            z-index: 200;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sidebar-item:hover {
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent-primary);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 150;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* Main Container */
        .main-content {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Section & Category styling */
        .category-section {
            margin-bottom: 45px;
            scroll-margin-top: 140px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 10px;
        }

        .category-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            position: relative;
        }

        .category-icon-box {
            width: 40px;
            height: 40px;
            background: var(--header-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(255, 0, 85, 0.3);
        }

        .add-item-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .add-item-btn:hover {
            background: var(--accent-neon);
            color: #000;
        }

        /* Items Grid Layout */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 18px;
        }

        /* Item Card & Hover Animation */
        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow);
        }

        .item-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--accent-primary);
            box-shadow: 0 12px 25px rgba(255, 0, 85, 0.2);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .item-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .item-price {
            font-size: 16px;
            font-weight: 900;
            color: var(--accent-neon);
            background: rgba(0, 242, 254, 0.08);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .item-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.4;
            margin-top: 4px;
        }

        .admin-controls {
            display: none;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--card-border);
        }

        .btn-admin {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            flex: 1;
        }

        .btn-edit {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .btn-delete {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        /* Addons Section Styling */
        .addons-container {
            margin-top: 20px;
            background: var(--addon-bg);
            border: 1px dashed var(--addon-border);
            border-radius: 14px;
            padding: 14px 18px;
        }

        .addons-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .addons-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .addon-badge {
            background: var(--card-bg);
            border: 1px solid var(--addon-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .addon-badge:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .addon-price {
            color: var(--accent-neon);
            font-weight: 800;
        }

        /* Footer & Secret Login */
        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--card-border);
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .secret-trigger {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            transition: color 0.3s;
        }

        .secret-trigger:hover {
            color: var(--accent-primary);
        }

        /* Admin Password Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .modal.active {
            display: flex;
        }

        .modal-card {
            background: var(--glass-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--text-primary);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-submit {
            flex: 1;
            padding: 12px;
            background: var(--header-gradient);
            border: none;
            color: white;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-cancel {
            padding: 12px 20px;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
        }

        .admin-banner {
            display: none;
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--accent-primary);
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            color: var(--accent-primary);
        }
    </style>
</head>
<body>

    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Top Navigation Bar -->
    <nav class="top-navbar">
        <div class="logo-container">
            <div class="logo">OF</div>
            <a href="tel:01000000000" class="contact-pill">
                <i class="fa-solid fa-phone"></i>
                <span>تواصل معنا</span>
            </a>
        </div>
        <div class="nav-actions">
            <button class="btn-icon" id="themeToggle" title="تغيير المظهر">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="btn-icon" id="sidebarToggle" title="القائمة السريعة">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>التنقل السريع</h3>
            <button class="btn-icon" id="sidebarClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-menu" id="sidebarMenu"></div>
    </aside>

    <!-- Hero Header -->
    <header class="hero">
        <h1 class="hero-title">OF DRINKS</h1>
        <p class="hero-subtitle">استمتع بأقوى المشروبات والميكسات الطبيعية، العصائر الفريش والكوكتيلات المميزة</p>
    </header>

    <!-- Horizontal Category Scroll Bar -->
    <div class="category-nav-wrapper">
        <div class="category-nav-container">
            <button class="scroll-btn" id="scrollRight"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="category-scroll-bar" id="categoryNav"></div>
            <button class="scroll-btn" id="scrollLeft"><i class="fa-solid fa-chevron-left"></i></button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="admin-banner" id="adminBanner">
            <i class="fa-solid fa-user-shield"></i> تم تفعيل وضع المدير (يمكنك تعديل الأسعار، إضافة أو حذف العناصر)
            <button onclick="logoutAdmin()" style="margin-right:15px; background:none; border:none; color:white; text-decoration:underline; cursor:pointer;">خروج</button>
        </div>
        <div id="menuContainer"></div>
    </main>

    <!-- Footer with Secret Admin Login Trigger -->
    <footer>
        <p>&copy; 2026 OF Store. جميع الحقوق محفوظة.</p>
        <p style="margin-top: 8px;">
            <span class="secret-trigger" id="adminTrigger" onclick="openAdminModal()">لوحة التحكم</span>
        </p>
    </footer>

    <!-- Admin Password Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-card">
            <h3 class="modal-title">تسجيل دخول المدير</h3>
            <div class="input-group">
                <label>كلمة السر</label>
                <input type="password" class="form-input" id="adminPasswordInput" placeholder="أدخل كلمة السر (افتراضي: 1234)">
            </div>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="loginAdmin()">دخول</button>
                <button class="btn-cancel" onclick="closeAdminModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Item Edit/Add Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-card">
            <h3 class="modal-title" id="itemModalTitle">إضافة عنصر</h3>
            <input type="hidden" id="editCategoryId">
            <input type="hidden" id="editItemId">
            <div class="input-group">
                <label>اسم المشروب / العنصر</label>
                <input type="text" class="form-input" id="itemNameInput">
            </div>
            <div class="input-group">
                <label>السعر (مثال: 50 أو L 50 | M 40)</label>
                <input type="text" class="form-input" id="itemPriceInput">
            </div>
            <div class="input-group">
                <label>الوصف / المكونات (اختياري)</label>
                <input type="text" class="form-input" id="itemDescInput">
            </div>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="saveItem()">حفظ</button>
                <button class="btn-cancel" onclick="closeItemModal()">إلغاء</button>
            </div>
        </div>
    </div>

                    { id: "h17", name: "قهوة غامق", price: "25" },
                    { id: "h18", name: "اسبريسو سنجل", price: "35" },
                    { id: "h19", name: "اسبريسو دبل", price: "50" },

        // State variables
        let menuData = JSON.parse(localStorage.getItem('of_menu_data')) || initialMenuData;
        let isAdmin = localStorage.getItem('of_admin_active') === 'true';

        // Elements
        const menuContainer = document.getElementById('menuContainer');
        const categoryNav = document.getElementById('categoryNav');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const themeToggle = document.getElementById('themeToggle');
        const adminBanner = document.getElementById('adminBanner');

        // Theme Toggle Logic
        let currentTheme = localStorage.getItem('of_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('of_theme', currentTheme);
            updateThemeIcon();
        });

        function updateThemeIcon() {
            themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        // Sidebar Navigation Logic
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        });

        document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        // Horizontal Category Scroll Logic
        document.getElementById('scrollRight').addEventListener('click', () => {
            categoryNav.scrollBy({ left: 180, behavior: 'smooth' });
        });
        document.getElementById('scrollLeft').addEventListener('click', () => {
            categoryNav.scrollBy({ left: -180, behavior: 'smooth' });
        });

        // Admin Modal Logic
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        function loginAdmin() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (pwd === '1234') { // Default manager password
                isAdmin = true;
                localStorage.setItem('of_admin_active', 'true');
                closeAdminModal();
                renderMenu();
                alert('تم تسجيل الدخول بنجاح كمدير!');
            } else {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem('of_admin_active', 'false');
            renderMenu();
        }

        // Render Menu Items & Categories
        function renderMenu() {
            adminBanner.style.display = isAdmin ? 'block' : 'none';

            categoryNav.innerHTML = '';
            sidebarMenu.innerHTML = '';
            menuContainer.innerHTML = '';

            menuData.forEach((cat, index) => {
                // Category Scroll Chips
                const chip = document.createElement('div');
                chip.className = `cat-chip ${index === 0 ? 'active' : ''}`;
                chip.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.name}`;
                chip.onclick = () => scrollToCategory(cat.id);
                categoryNav.appendChild(chip);

                // Sidebar Items
                const sideItem = document.createElement('a');
                sideItem.className = 'sidebar-item';
                sideItem.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.name}`;
                sideItem.onclick = () => {
                    scrollToCategory(cat.id);
                    closeSidebar();
                };
                sidebarMenu.appendChild(sideItem);

                // Main Category Section
                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = cat.id;

                let itemsHTML = cat.items.map(item => `
                    <div class="item-card">
                        <div>
                            <div class="item-header">
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">${item.price} ج.م</div>
                            </div>
                            ${item.desc ? `<div class="item-desc">(${item.desc})</div>` : ''}
                        </div>
                        ${isAdmin ? `
                            <div class="admin-controls" style="display:flex;">
                                <button class="btn-admin btn-edit" onclick="openItemModal('${cat.id}', '${item.id}')">تعديل</button>
                                <button class="btn-admin btn-delete" onclick="deleteItem('${cat.id}', '${item.id}')">حذف</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                let addonsHTML = '';
                if (cat.addons && cat.addons.length > 0) {
                    addonsHTML = `
                        <div class="addons-container">
                            <div class="addons-title"><i class="fa-solid fa-plus-circle"></i> إضافات متاحة:</div>
                            <div class="addons-grid">
                                ${cat.addons.map(addon => `
                                    <div class="addon-badge">
                                        <span>${addon.name}</span>
                                        ${addon.price !== '-' ? `<span class="addon-price">+${addon.price} ج.م</span>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-title-group">
                            <div class="category-icon-box"><i class="fa-solid ${cat.icon}"></i></div>
                            <h2 class="category-title">${cat.name}</h2>
                        </div>
                        ${isAdmin ? `<button class="add-item-btn" style="display:flex;" onclick="openItemModal('${cat.id}')"><i class="fa-solid fa-plus"></i> إضافة عنصر</button>` : ''}
                    </div>
                    <div class="items-grid">${itemsHTML}</div>
                    ${addonsHTML}
                `;

                menuContainer.appendChild(section);
            });
        }

        function scrollToCategory(id) {
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Add/Edit Item Functions
        function openItemModal(catId, itemId = null) {
            document.getElementById('editCategoryId').value = catId;
            document.getElementById('editItemId').value = itemId || '';

            if (itemId) {
                document.getElementById('itemModalTitle').innerText = 'تعديل عنصر';
                const cat = menuData.find(c => c.id === catId);
                const item = cat.items.find(i => i.id === itemId);
                document.getElementById('itemNameInput').value = item.name;
                document.getElementById('itemPriceInput').value = item.price;
                document.getElementById('itemDescInput').value = item.desc || '';
            } else {
                document.getElementById('itemModalTitle').innerText = 'إضافة عنصر جديد';
                document.getElementById('itemNameInput').value = '';
                document.getElementById('itemPriceInput').value = '';
                document.getElementById('itemDescInput').value = '';
            }

            document.getElementById('itemModal').classList.add('active');
        }

        function closeItemModal() {
            document.getElementById('itemModal').classList.remove('active');
        }

        function saveItem() {
            const catId = document.getElementById('editCategoryId').value;
            const itemId = document.getElementById('editItemId').value;
            const name = document.getElementById('itemNameInput').value.trim();
            const price = document.getElementById('itemPriceInput').value.trim();
            const desc = document.getElementById('itemDescInput').value.trim();

            if (!name || !price) {
                alert('يرجى إدخال الاسم والسعر!');
                return;
            }

            const cat = menuData.find(c => c.id === catId);

            if (itemId) {
                const item = cat.items.find(i => i.id === itemId);
                item.name = name;
                item.price = price;
                if (desc) item.desc = desc;
                else delete item.desc;
            } else {
                const newItem = {
                    id: 'custom_' + Date.now(),
                    name,
                    price,
                    ...(desc && { desc })
                };
                cat.items.push(newItem);
            }

            localStorage.setItem('of_menu_data', JSON.stringify(menuData));
            closeItemModal();
            renderMenu();
        }

        function deleteItem(catId, itemId) {
            if (confirm('هل أنت تأكد من حذف هذا العنصر؟')) {
                const cat = menuData.find(c => c.id === catId);
                cat.items = cat.items.filter(i => i.id !== itemId);
                localStorage.setItem('of_menu_data', JSON.stringify(menuData));
                renderMenu();
            }
        }

        // Initialize Render
        renderMenu();
    </script>
</body>
</html>
