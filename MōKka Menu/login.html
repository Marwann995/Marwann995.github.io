<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MōKka Admin Login</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #190e07;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        /* Hidden by default to prevent visual flash during session check */
        .login-box {
            display: none;
            background: #2e190d;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 35px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .login-logo {
            width: 90px;
            margin-bottom: 15px;
        }
        .login-box h2 {
            color: #f8f2e9;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .login-box p {
            color: #927c68;
            font-size: 13px;
            margin-bottom: 22px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid #927c68;
            background: #190e07;
            color: #fff;
            text-align: right;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        .login-box input:focus {
            border-color: #d4af37;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #d4af37;
            color: #190e07;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
        }
        .login-error {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: 700;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box" id="loginBox">
    <img src="assets/logoIcon.png" alt="MōKka Logo" class="login-logo">
    <h2>تسجيل دخول المدير</h2>
    <p>أدخل البريد الإلكتروني وكلمة المرور للوصول</p>
    
    <form id="loginForm">
        <input type="email" id="emailInput" placeholder="البريد الإلكتروني" required>
        <input type="password" id="passwordInput" placeholder="كلمة المرور" required autocomplete="current-password">
        <button type="submit" id="submitBtn">دخول</button>
    </form>
    <p id="loginError" class="login-error">بيانات الدخول غير صحيحة!</p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    onAuthStateChanged, 
    setPersistence, 
    browserSessionPersistence 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD2AcKtUomqBtBVhwXeJGbQHL_X5gizKlM",
    authDomain: "mokka-menu.firebaseapp.com",
    projectId: "mokka-menu",
    storageBucket: "mokka-menu.firebasestorage.app",
    messagingSenderId: "963891759088",
    appId: "1:963891759088:web:b1b376f8a6ba656a90bf35",
    measurementId: "G-69VEHN45TL"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBox = document.getElementById('loginBox');

  // Check auth status before rendering form
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.replace('admin.html');
    } else {
      loginBox.style.display = 'block';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const errorEl = document.getElementById('loginError');
    const submitBtn = document.getElementById('submitBtn');

    errorEl.style.display = 'none';
    submitBtn.innerText = 'جاري التحقق...';
    submitBtn.disabled = true;

    try {
      // Force session to expire as soon as the browser/tab closes
      await setPersistence(auth, browserSessionPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'admin.html';
    } catch (error) {
      errorEl.textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة!';
      errorEl.style.display = 'block';
      submitBtn.innerText = 'دخول';
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
